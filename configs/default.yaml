providers:
  - name: primary
    provider_type: openai          # uses OpenAI if OPENAI_API_KEY set, else FakeLLM
    model: gpt-4o-mini
    fail_rate: 0.25                # only used when falling back to FakeLLM
    base_latency_ms: 180           # only used when falling back to FakeLLM
    cost_per_1k_tokens: 0.00015   # gpt-4o-mini input price per 1k tokens
  - name: backup
    provider_type: fake            # always FakeLLM (final safety net)
    fail_rate: 0.05
    base_latency_ms: 260
    cost_per_1k_tokens: 0.006
circuit_breaker:
  failure_threshold: 3
  reset_timeout_seconds: 2
  success_threshold: 1
cache:
  enabled: true
  backend: redis           # "memory" or "redis" (falls back to memory if Redis is unavailable)
  ttl_seconds: 300
  similarity_threshold: 0.92
  redis_url: "redis://localhost:6379/0"
load_test:
  requests: 200
  concurrency: 10

# Chaos scenarios: each overrides provider fail_rate for targeted testing.
scenarios:
  - name: primary_timeout_100
    description: "Primary provider fails 100% - all traffic should fallback"
    provider_overrides:
      primary: 1.0
  - name: primary_flaky_50
    description: "Primary provider fails 50% - circuit should oscillate"
    provider_overrides:
      primary: 0.5
  - name: all_healthy
    description: "Baseline - both providers healthy"
    provider_overrides:
      primary: 0.0
      backup: 0.0
  - name: cache_stale_candidate
    description: "Cache safety scenario - similar prompts should not create stale false hits"
    provider_overrides:
      primary: 0.0
      backup: 0.0
  - name: recovery_demo
    description: "Circuit opens under moderate failures then recovers - measures recovery_time_ms"
    disable_cache: true
    provider_overrides:
      primary: 0.4
      backup: 0.0
